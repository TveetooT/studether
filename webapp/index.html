<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Livether (beta)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f5f7);
      --sec: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1c1c1e);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --btn: var(--tg-theme-button-color, #0f3460);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --accent: #e94560;
      --success: #27ae60;
      --danger: #e74c3c;
      --radius: 16px;
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 100px;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.4;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      min-width: 22px;
      text-align: center;
    }

    /* Cards */
    .card {
      background: var(--sec);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    /* Fields */
    .field {
      margin-bottom: 18px;
    }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block;
      font-size: 13px;
      color: var(--hint);
      margin-bottom: 7px;
      font-weight: 500;
    }
    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1.5px solid rgba(0,0,0,0.08);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      border-radius: 12px;
      padding: 13px 15px;
      outline: none;
      resize: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--btn);
      box-shadow: 0 0 0 3px rgba(15,52,96,0.12);
    }
    .field input.error,
    .field textarea.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(231,76,60,0.12);
    }
    .field .error-text {
      font-size: 12px;
      color: var(--danger);
      margin-top: 6px;
      display: none;
    }
    .field.error .error-text { display: block; }
    .field textarea { min-height: 100px; }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.98); opacity: 0.85; }
    .btn-primary {
      background: var(--btn);
      color: var(--btn-text);
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(15,52,96,0.25);
    }
    .btn-ghost {
      background: transparent;
      color: var(--hint);
      font-size: 14px;
      margin-top: 12px;
    }
    .btn:disabled {
      opacity: 0.55;
      pointer-events: none;
    }

    /* Profile view card */
    .profile-view h2 {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .profile-view .meta {
      color: var(--hint);
      font-size: 14px;
      margin-bottom: 18px;
    }
    .profile-view .section {
      margin-bottom: 16px;
    }
    .profile-view .section:last-child { margin-bottom: 0; }
    .profile-view .section .lbl {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--hint);
      margin-bottom: 5px;
      font-weight: 600;
    }
    .profile-view .section .val {
      font-size: 15px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    /* Reactions */
    .reactions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    .reactions button {
      flex: 1;
      padding: 16px 0;
      border: none;
      border-radius: 14px;
      font-size: 24px;
      cursor: pointer;
      background: var(--sec);
      box-shadow: var(--shadow);
      transition: transform 0.15s;
    }
    .reactions button:active { transform: scale(0.94); }
    .reactions .like { background: #e8f8ef; }
    .reactions .dislike { background: #fdecea; }
    .reactions .report { background: #fff5e6; }

    /* Status / empty */
    .status {
      text-align: center;
      padding: 48px 20px;
      color: var(--hint);
      font-size: 15px;
      line-height: 1.55;
    }
    .status .icon {
      font-size: 48px;
      margin-bottom: 14px;
      display: block;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1c1c1e;
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      z-index: 300;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Tab bar */
    .tabbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      background: var(--sec);
      border-top: 1px solid rgba(0,0,0,0.06);
      padding: 6px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
    }
    .tabbar button {
      flex: 1;
      padding: 8px 4px 6px;
      background: none;
      border: none;
      font-size: 11px;
      color: var(--hint);
      font-family: inherit;
      cursor: pointer;
      position: relative;
      font-weight: 500;
    }
    .tabbar button.active {
      color: var(--btn);
      font-weight: 700;
    }
    .tabbar button .ico {
      display: block;
      font-size: 24px;
      margin-bottom: 3px;
    }
    .tabbar .dot {
      position: absolute;
      top: 5px;
      right: calc(50% - 20px);
      width: 9px;
      height: 9px;
      background: var(--accent);
      border-radius: 50%;
      border: 2px solid var(--sec);
    }

    /* Spinner */
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(0,0,0,0.08);
      border-top-color: var(--btn);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div id="app"></div>

  <nav class="tabbar">
    <button id="tab-profile" onclick="go('profile')">
      <span class="ico">👤</span>Анкета
    </button>
    <button id="tab-find" onclick="go('find')">
      <span class="ico">🔍</span>Поиск
    </button>
    <button id="tab-likes" onclick="go('likes')">
      <span class="ico">📬</span>Запросы
      <span id="likes-dot" class="dot hidden"></span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.enableClosingConfirmation();

    if (!tg.initDataUnsafe?.user?.id) {
      document.body.innerHTML = '<div class="status"><span class="icon">🔒</span>Откройте приложение через Telegram-бота</div>';
      throw new Error('Not inside Telegram');
    }

    const USER_ID = tg.initDataUnsafe.user.id;
    const API = '/webapp2/api';

    let regions = {};
    let currentTab = 'profile';
    let currentViewId = null;
    let likesCount = 0;

    // ---------- Helpers ----------
    function $(id) { return document.getElementById(id); }

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2300);
    }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Ошибка сети');
      }
      return res.json();
    }

    function yearWord(age) {
      if (age == null) return '';
      const n = Number(age);
      if (n % 10 === 1 && n % 100 !== 11) return 'год';
      if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'года';
      return 'лет';
    }

    function esc(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ---------- Navigation ----------
    function go(tab) {
      currentTab = tab;
      document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
      $('tab-' + tab).classList.add('active');
      render();
    }

    async function render() {
      const app = $('app');
      app.innerHTML = '<div class="spinner"></div>';
      try {
        if (currentTab === 'profile') await renderProfile(app);
        else if (currentTab === 'find') await renderFind(app);
        else if (currentTab === 'likes') await renderLikes(app);
      } catch (e) {
        app.innerHTML = `<div class="status"><span class="icon">⚠️</span>${esc(e.message)}</div>`;
      }
    }

    // ---------- PROFILE ----------
    async function renderProfile(app) {
      const data = await api(`/profile?user_id=${USER_ID}`);
      if (data.error) {
        app.innerHTML = `<div class="status"><span class="icon">📝</span>Профиль не найден.<br>Напишите боту /start</div>`;
        return;
      }

      app.innerHTML = `
        <div class="header"><h1>👤 Моя анкета</h1></div>
        <div class="card">
          <div class="field" id="field-name">
            <label>Имя / ник</label>
            <input id="f-name" type="text" maxlength="50" value="${esc(data.name || '')}" placeholder="Как тебя называть">
            <div class="error-text">Укажите имя (1–50 символов)</div>
          </div>

          <div class="field" id="field-age">
            <label>Возраст</label>
            <input id="f-age" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3"
                   value="${data.age != null ? data.age : ''}" placeholder="От 16 до 100">
            <div class="error-text">Возраст должен быть от 16 до 100 лет</div>
          </div>

          <div class="field">
            <label>Учебное заведение</label>
            <input id="f-univer" type="text" maxlength="100" value="${esc(data.univer || '')}" placeholder="ВУЗ или колледж">
          </div>

          <div class="field">
            <label>О себе</label>
            <textarea id="f-about" maxlength="1000" rows="4" placeholder="Увлечения, образ жизни, привычки...">${esc(data.about || '')}</textarea>
          </div>

          <div class="field">
            <label>Пожелания к соседу</label>
            <textarea id="f-req" maxlength="1000" rows="4" placeholder="Чистоплотность, режим, животные...">${esc(data.requirements || '')}</textarea>
          </div>

          <div class="field">
            <label>Регион</label>
            <select id="f-region"></select>
          </div>

          <div class="field">
            <label>Город</label>
            <select id="f-city"></select>
          </div>
        </div>
        <button class="btn btn-primary" id="save-btn">💾 Сохранить</button>
      `;

      // Regions & cities
      const regionSel = $('f-region');
      const citySel = $('f-city');
      regionSel.innerHTML = '<option value="">— выберите регион —</option>';
      Object.keys(regions).sort().forEach(r => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        if (r === data.region) opt.selected = true;
        regionSel.appendChild(opt);
      });

      function fillCities(selected) {
        citySel.innerHTML = '<option value="">— выберите город —</option>';
        (regions[regionSel.value] || []).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          if (c === selected) opt.selected = true;
          citySel.appendChild(opt);
        });
      }
      fillCities(data.city);
      regionSel.onchange = () => fillCities(null);

      // ===== Strict age validation =====
      const ageInput = $('f-age');
      const ageField = $('field-age');

      ageInput.addEventListener('input', () => {
        // Allow only digits
        let val = ageInput.value.replace(/\D/g, '');
        if (val.length > 3) val = val.slice(0, 3);
        ageInput.value = val;

        // Live validation
        const num = parseInt(val, 10);
        if (val === '') {
          ageField.classList.remove('error');
        } else if (isNaN(num) || num < 16 || num > 100) {
          ageField.classList.add('error');
        } else {
          ageField.classList.remove('error');
        }
      });

      // Block non-digit keys (extra safety)
      ageInput.addEventListener('keypress', (e) => {
        if (!/[0-9]/.test(e.key)) e.preventDefault();
      });

      // Paste protection
      ageInput.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text');
        const digits = text.replace(/\D/g, '').slice(0, 3);
        ageInput.value = digits;
        ageInput.dispatchEvent(new Event('input'));
      });

      $('save-btn').onclick = saveProfile;
    }

    async function saveProfile() {
      const name = $('f-name').value.trim();
      const ageRaw = $('f-age').value.trim();
      const age = ageRaw === '' ? null : parseInt(ageRaw, 10);
      const univer = $('f-univer').value.trim();
      const about = $('f-about').value.trim();
      const requirements = $('f-req').value.trim();
      const region = $('f-region').value;
      const city = $('f-city').value;

      // Clear previous errors
      $('field-name').classList.remove('error');
      $('field-age').classList.remove('error');

      let hasError = false;

      if (!name || name.length > 50) {
        $('field-name').classList.add('error');
        hasError = true;
      }

      if (ageRaw === '' || isNaN(age) || age < 16 || age > 100) {
        $('field-age').classList.add('error');
        hasError = true;
        toast('Укажите возраст от 16 до 100 лет');
      }

      if (hasError) return;

      if (univer.length > 100) { toast('Слишком длинное название учебного заведения'); return; }
      if (about.length > 1000) { toast('«О себе» — максимум 1000 символов'); return; }
      if (requirements.length > 1000) { toast('Пожелания — максимум 1000 символов'); return; }

      const btn = $('save-btn');
      btn.disabled = true;
      btn.textContent = 'Сохранение…';

      try {
        await api('/profile', {
          method: 'POST',
          body: JSON.stringify({
            user_id: USER_ID,
            name, age, univer, about, requirements, region, city
          })
        });
        toast('✅ Анкета сохранена');
        tg.HapticFeedback.notificationOccurred('success');
      } catch (e) {
        toast('❌ ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 Сохранить';
      }
    }

    // ---------- FIND ----------
    async function renderFind(app) {
      app.innerHTML = `<div class="header"><h1>🔍 Поиск соседа</h1></div><div class="spinner"></div>`;

      const data = await api(`/find?user_id=${USER_ID}`);

      if (data.error) {
        app.innerHTML = `
          <div class="header"><h1>🔍 Поиск соседа</h1></div>
          <div class="status">
            <span class="icon">📍</span>
            ${esc(data.error)}
            <button class="btn btn-primary" style="margin-top:24px" onclick="go('profile')">Заполнить анкету</button>
          </div>`;
        return;
      }

      if (!data.profile) {
        app.innerHTML = `
          <div class="header"><h1>🔍 Поиск соседа</h1></div>
          <div class="status">
            <span class="icon">🌆</span>
            Пока нет доступных анкет<br>в твоём городе
            <button class="btn btn-ghost" onclick="render()">Обновить</button>
          </div>`;
        return;
      }

      currentViewId = data.profile.user_id;
      const p = data.profile;

      app.innerHTML = `
        <div class="header"><h1>🔍 Поиск соседа</h1></div>
        <div class="card profile-view">
          <h2>${esc(p.name || 'Без имени')}</h2>
          <div class="meta">${p.age ? p.age + ' ' + yearWord(p.age) : '?'} · ${esc(p.univer || '')}</div>
          ${p.about ? `<div class="section"><div class="lbl">О себе</div><div class="val">${esc(p.about)}</div></div>` : ''}
          ${p.requirements ? `<div class="section"><div class="lbl">Пожелания к соседу</div><div class="val">${esc(p.requirements)}</div></div>` : ''}
        </div>
        <div class="reactions">
          <button class="like" onclick="react('like')">👍</button>
          <button class="dislike" onclick="react('dislike')">👎</button>
          <button class="report" onclick="react('report')">⚠️</button>
        </div>
        <button class="btn btn-ghost" onclick="render()">➡️ Следующая анкета</button>
      `;
    }

    async function react(reaction) {
      if (!currentViewId) return;
      try {
        await api('/view', {
          method: 'POST',
          body: JSON.stringify({
            user_id: USER_ID,
            viewed_user_id: currentViewId,
            reaction
          })
        });
        tg.HapticFeedback.impactOccurred('light');
        if (reaction === 'like') toast('👍 Лайк отправлен');
        else if (reaction === 'report') toast('⚠️ Жалоба отправлена');
        await render();
      } catch (e) {
        toast('❌ ' + e.message);
      }
    }

    // ---------- LIKES ----------
    async function renderLikes(app) {
      app.innerHTML = `
        <div class="header">
          <h1>📬 Запросы</h1>
          ${likesCount ? `<span class="badge">${likesCount}</span>` : ''}
        </div>
        <div class="spinner"></div>`;

      const data = await api(`/likes?user_id=${USER_ID}`);
      const list = data.likes || [];
      likesCount = list.length;
      updateLikesDot();

      if (list.length === 0) {
        app.innerHTML = `
          <div class="header"><h1>📬 Запросы</h1></div>
          <div class="status">
            <span class="icon">📭</span>
            Нет новых запросов на сожительство
          </div>`;
        return;
      }

      let html = `
        <div class="header">
          <h1>📬 Запросы</h1>
          <span class="badge">${list.length}</span>
        </div>`;

      list.forEach(p => {
        html += `
          <div class="card profile-view">
            <h2>${esc(p.name || 'Без имени')}</h2>
            <div class="meta">${p.age ? p.age + ' ' + yearWord(p.age) : '?'} · ${esc(p.univer || '')}</div>
            ${p.about ? `<div class="section"><div class="lbl">О себе</div><div class="val">${esc(p.about)}</div></div>` : ''}
            ${p.requirements ? `<div class="section"><div class="lbl">Пожелания</div><div class="val">${esc(p.requirements)}</div></div>` : ''}
            <div class="reactions">
              <button class="like" onclick="answerLike(${p.user_id}, 'like')">👍 Ответить</button>
              <button class="dislike" onclick="answerLike(${p.user_id}, 'dislike')">👎 Пропустить</button>
            </div>
          </div>`;
      });

      app.innerHTML = html;
    }

    async function answerLike(likedId, reaction) {
      try {
        await api('/view', {
          method: 'POST',
          body: JSON.stringify({
            user_id: USER_ID,
            viewed_user_id: likedId,
            reaction
          })
        });
        if (reaction === 'like') {
          toast('🎉 Совпадение! Смотрите сообщения в боте');
          tg.HapticFeedback.notificationOccurred('success');
        }
        await render();
      } catch (e) {
        toast('❌ ' + e.message);
      }
    }

    function updateLikesDot() {
      const dot = $('likes-dot');
      likesCount > 0 ? dot.classList.remove('hidden') : dot.classList.add('hidden');
    }

    // ---------- Start ----------
    (async () => {
      try {
        const r = await api('/webapp2/api/regions');
        regions = r.regions || {};
      } catch (e) {
        console.error('Regions failed', e);
      }

      try {
        const likesData = await api(`/webapp2/api/likes?user_id=${USER_ID}`);
        likesCount = (likesData.likes || []).length;
        updateLikesDot();
      } catch (_) {}

      go('profile');
    })();
  </script>
</body>
</html>
